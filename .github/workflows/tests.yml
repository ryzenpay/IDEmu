name: tests

# Os testes de idemu/ não precisam de firmware nem de QEMU: cobrem builder, coding, MOST/V850, CIC, iDrive 7/8 e
# a interface. Rodar a cada push economiza o achado do bimmulator de que suíte verde é pré-condição de release.

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the test suite
        run: |
          python -m pip install --upgrade pytest
          python -m pytest tests -q
      - name: i18n check
        run: python3 tools/i18n_check.py
